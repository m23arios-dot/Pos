<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#0b0d0e">
<title>BEI MARIA POS – Demo</title>
<style>
:root{--bg:#090b0c;--panel:#15191b;--panel2:#1c2124;--line:#30363a;--pink:#f21868;--green:#5acb6b;--orange:#ff6b32;--text:#f5f5f5;--muted:#aeb3b7}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html{background:var(--bg)}
body{margin:0;background:var(--bg);color:var(--text);font-family:Arial,Helvetica,sans-serif;min-height:100vh}
button,input{font:inherit}
button{touch-action:manipulation}
header{height:92px;border-bottom:1px solid #252a2d;display:flex;align-items:center;justify-content:space-between;padding:10px 22px;background:#0b0d0e;position:sticky;top:0;z-index:20}
.logo{display:flex;align-items:center;justify-content:center;width:320px;height:82px}.logo img{max-width:100%;max-height:100%;object-fit:contain}
.smallbtn{background:var(--panel2);border:1px solid var(--line);color:#fff;border-radius:16px;padding:12px 18px;font-size:16px;cursor:pointer;min-height:54px}
.app{display:grid;grid-template-columns:230px minmax(0,1fr) 370px;gap:14px;padding:16px;max-width:1500px;margin:auto}
aside{display:flex;flex-direction:column;gap:8px}.cat{border:1px solid var(--line);background:var(--panel);color:#eee;border-radius:14px;padding:16px 13px;font-size:16px;text-align:left;cursor:pointer}.cat.active{background:var(--pink);border-color:var(--pink);font-weight:bold}
.cat .cat-icon{display:inline-flex;margin-right:10px;width:28px;min-width:28px;justify-content:center;align-items:center;font-size:18px;font-weight:700;line-height:1;color:#f5f5f5;vertical-align:middle}
main{min-width:0}.title{font-size:28px;font-weight:800;margin:4px 0 12px}.grid{display:grid;grid-template-columns:repeat(4,minmax(130px,1fr));gap:10px}.item{min-height:120px;background:linear-gradient(145deg,#171c1f,#101315);border:1px solid var(--line);border-radius:14px;color:#fff;text-align:left;padding:12px;cursor:pointer}.item.searched-highlight{border:3px solid var(--pink)!important;box-shadow:0 0 0 3px rgba(242,24,104,.18),0 0 22px rgba(242,24,104,.22);background:linear-gradient(145deg,#24131b,#151012)!important;transform:translateY(-1px)}.item.searched-highlight::after{content:"GEFUNDEN";position:absolute;right:10px;bottom:9px;background:var(--pink);color:#fff;border-radius:7px;padding:4px 7px;font-size:10px;font-weight:800;letter-spacing:.4px}.item.searched-highlight .product-main{outline:none}.item:active{transform:scale(.985)}.num{font-size:28px;font-weight:800}.name{font-size:15px;line-height:1.15;margin-top:5px;min-height:35px}.price{color:var(--pink);font-size:21px;font-weight:800;margin-top:8px}
.product-wrap{padding:0;position:relative;overflow:hidden}.product-main{background:transparent;border:0;color:#fff;text-align:left;width:100%;height:100%;padding:13px;padding-right:44px;cursor:pointer}.edit-btn{position:absolute;right:8px;top:8px;width:32px;height:32px;border:1px solid #444;background:#242a2d;color:#fff;border-radius:8px;cursor:pointer;z-index:2}
.add-product-tile{border:2px dashed var(--pink)!important;background:#121618!important;text-align:center!important;display:flex;flex-direction:column;align-items:center;justify-content:center}.add-product-tile .plus{font-size:38px;line-height:1;color:var(--pink);font-weight:300}.add-product-tile .name{min-height:auto;font-size:16px;font-weight:800;margin-top:8px}.add-product-tile .price{font-size:15px;margin-top:6px}
.mobile-search{display:flex;gap:10px;margin:0 0 12px}.mobile-search input{flex:1;min-width:0;background:#111516;border:2px solid #3a4145;color:#fff;border-radius:15px;padding:14px 16px;font-size:18px;outline:none}.mobile-search input:focus{border-color:var(--pink)}.mobile-search button{background:var(--pink);color:#fff;border:0;border-radius:15px;padding:0 20px;font-weight:800;cursor:pointer}
.order{background:var(--panel);border:1px solid #252b2e;border-radius:14px;overflow:hidden;position:sticky;top:108px;height:fit-content}.orderhead{background:var(--pink);padding:16px;font-size:25px;font-weight:800;text-align:center;display:flex;align-items:center;justify-content:center;gap:12px}.orderhead input{width:105px;background:#fff;color:#111;border:0;border-radius:10px;padding:7px 8px;font-size:25px;font-weight:800;text-align:center;outline:none}.rows{padding:5px 12px}.row{display:grid;grid-template-columns:30px 1fr auto;gap:7px;padding:13px 0;border-bottom:1px solid var(--line);align-items:center}.rowname{font-size:14px}.del{color:#ff667d;cursor:pointer;font-size:18px}.total{display:flex;justify-content:space-between;padding:18px 14px;font-size:19px;font-weight:700}.total b{color:var(--pink);font-size:27px}.actions{display:grid;grid-template-columns:1fr;gap:8px;padding:0 12px 12px}.action{border:0;border-radius:12px;padding:17px;color:#fff;font-weight:800;font-size:17px;cursor:pointer}.cash{background:var(--green)}.kitchen{background:var(--orange)}.secondary{background:#22282b;border:1px solid var(--line)}
footer{text-align:center;color:#858b8f;font-size:13px;padding:18px}
.modal-backdrop{position:fixed;inset:0;background:rgba(0,0,0,.72);display:none;align-items:center;justify-content:center;z-index:50;padding:20px}.modal-backdrop.show{display:flex}.modal{width:min(420px,100%);background:#171b1d;border:1px solid #444;border-radius:16px;padding:22px;box-shadow:0 20px 60px #000}.modal h2{margin:0 0 18px}.modal label{display:block;font-size:14px;color:#bbb;margin:12px 0}.modal input{display:block;width:100%;margin-top:6px;background:#0e1112;border:1px solid #3b4246;color:#fff;border-radius:9px;padding:13px;font-size:17px;outline:none}.modal input:focus{border-color:var(--pink)}.modal-actions{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:18px}
@media (min-width:761px) and (max-width:1100px){
  .app{grid-template-columns:155px minmax(0,1fr) 285px;gap:10px;padding:10px;max-width:none}
  .cat{padding:13px 10px;font-size:14px}
  .cat .cat-icon{margin-right:7px;width:24px;min-width:24px;font-size:16px}
  .grid{grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
  .item{min-height:135px;padding:11px}
  .num{font-size:27px}
  .name{font-size:15px}
  .price{font-size:20px}
  .order{width:100%;max-width:285px}
  .orderhead{font-size:22px;padding:13px;gap:8px}
  .orderhead input{width:78px;font-size:22px;padding:6px}
  .action{padding:14px 7px;font-size:14px}
}
@media(max-width:760px){
 body{padding-bottom:20px}
 header{height:104px;padding:12px 22px;position:relative;border-bottom:1px solid #2b3033}
 .logo{width:230px;height:78px}
 header .smallbtn{min-width:78px;height:58px;padding:0 16px;font-size:0;border-radius:17px;display:flex;align-items:center;justify-content:center}
 header .smallbtn:first-child{font-size:0}.smallbtn:first-child::after{content:'☰';font-size:30px;line-height:1}
 header .smallbtn:last-child{font-size:20px;min-width:150px}
 .app{display:flex;flex-direction:column;gap:16px;padding:20px 22px 8px;max-width:none}
 aside{order:1;display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}
 .cat{min-height:88px;padding:13px 12px;text-align:left;font-size:15px;display:flex;align-items:center;justify-content:flex-start;border-radius:16px;line-height:1.12}
 .cat .cat-icon{font-size:18px;margin-right:10px;width:28px;min-width:28px;flex:0 0 auto}
 main{order:2}
 .title{font-size:30px;line-height:1.1;margin:2px 0 14px}
 .mobile-search{gap:10px;margin-bottom:16px}.mobile-search input{height:66px;border-radius:16px;padding:12px 16px;font-size:21px;background:#fff;color:#222;border:2px solid #777}.mobile-search input::placeholder{color:#a8a8a8;font-weight:700}.mobile-search button{height:66px;width:110px;padding:0;border-radius:16px;font-size:0}.mobile-search button::after{content:'→';font-size:42px;line-height:1}
 .grid{grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}
 .item{min-height:165px;border-radius:16px;padding:13px}
 .product-main{padding:13px;padding-right:44px}.num{font-size:36px}.name{font-size:18px;line-height:1.16;min-height:55px;margin-top:7px}.price{font-size:24px;margin-top:9px}
 .edit-btn{width:30px;height:30px;right:7px;top:7px}
 .add-product-tile{min-height:165px}
 .order{order:3;position:static;width:100%;border-radius:16px;margin-top:4px}
 .orderhead{font-size:27px;padding:18px;gap:12px}.orderhead input{width:110px;font-size:28px;padding:8px}
 .rows{max-height:42vh;overflow:auto}.row{grid-template-columns:38px 1fr auto;gap:6px;padding:13px 0}.rowname{font-size:15px}
 .total{padding:17px 16px;font-size:20px}.total b{font-size:29px}
 .actions{grid-template-columns:1fr 1fr;gap:10px;padding:0 14px 14px}.action{padding:18px 8px;font-size:15px;min-height:60px}.actions .secondary{grid-column:auto}.actions .secondary:last-child{grid-column:1/-1}
 footer{padding:16px 10px;font-size:12px}
}
@media(min-width:761px){.mobile-search{max-width:560px}}
</style>
</head>

<script>
const catsEl=document.getElementById('cats'), titleEl=document.getElementById('title'), itemsEl=document.getElementById('items'), rowsEl=document.getElementById('rows'), sumEl=document.getElementById('sum');
const data={
"Starters":[["1","Tzatziki (200g)","5,50"],["10","Knoblauchbrot","5,00"],["16","Saganaki","8,80"],["7","Feta in Folie gegrillt","8,80"],["9","Peperoni (griechische Peperoni)","5,50"],["8","Gegrillte Peperoni mit Knoblauch","7,50"],["82","Oliven","5,50"]],
"Salate":[["19","Gemischter griechischer Salat","14,30"],["20","Thunfischsalat","14,30"],["33","Souvlaki Salat","15,50"],["34","Hähnchen Salat","15,50"],["24","Gyros Salat","15,50"],["39","Lamm Salat","15,50"]],
"Pita und Gyros Box":[["54","Gyros-Box","8,50"],["27","Gyros Pita","7,50"],["28","Suzuki Pita","7,50"],["29","Veggie Pita","7,50"],["30","Souvlaki Pita","7,50"]],
"Gyros Souvlaki und Suzuki":[["24","Gyros · groß","15,50"],["63","Gyros XXL","18,00"],["25","Gyros in Metaxasauce","16,50"],["26","Gyros mit Weichkäse überbacken · groß","16,50"],["30","Souvlaki · groß","15,50"],["31","Souvlaki mit Butterkäse überbacken","16,50"],["32","Teufel-Spieß (scharf)","16,50"],["33","Bifteki gefüllt mit Weichkäse","16,50"],["34","Suzuki","15,50"],["35","Suzuki mit Butterkäse überbacken","16,50"]],
"Highlights Bei Maria":[["56","Grillteller","24,50"],["57","Wohnbauteller","17,00"],["37","Korfu-Teller","19,50"],["39","Apollon-Teller","16,50"],["38","Hellas-Teller","16,50"],["61","Gegrillte Hähnchenbrust","16,50"]],
"Unsere Lamm-Spezialitäten":[["101","Sparta-Teller","18,50"],["105","Herkules-Teller","18,50"],["104","Adamos-Teller","22,00"],["100","Dionysos-Teller","18,50"]],
"Schnitzel Klassiker":[["41","Jägerschnitzel","17,50"],["40","Schnitzel Wiener Art","16,00"]],
"Kinder & Seniorenteller":[["48","Gyros","9,50"],["50","Chicken Nuggets · 5 Stück","9,50"],["51","Souvlaki","9,50"],["52","Schnitzel","9,50"],["15","Currywurst","10,00"]],
"Beilagen":[["12","Pommes","4,00"],["13","Tzatziki","3,50"]],
"Getränke":[["14","Cola 0,33l","3,00"],["15","Fanta 0,33l","3,00"],["16","Bier 0,5l","4,00"],["17","Wein 0,2l","4,50"]],
"Desserts":[["18","Dessert","5,50"]]
};
let cat=Object.keys(data)[0], order=[];
let highlightedArticle=null;
function euro(n){return n.toFixed(2).replace('.',',')+' €'}
const categoryIcons={
  'Starters':'✦','Salate':'○','Pita und Gyros Box':'▰','Gyros Souvlaki und Suzuki':'●','Highlights Bei Maria':'★','Unsere Lamm-Spezialitäten':'◆','Schnitzel Klassiker':'□','Kinder & Seniorenteller':'♙','Beilagen':'▪','Getränke':'◉','Desserts':'◇'
};
function renderCats(){
  catsEl.innerHTML = Object.keys(data).map(c=>`<button type="button" class="cat ${c===cat?'active':''}" onclick="selectCat('${c.replaceAll("'","\\'")}')"><span class="cat-icon">${categoryIcons[c]||'•'}</span><span>${c}</span></button>`).join('');
}
function selectCat(c, keepHighlight=false){
  cat=c;
  if(!keepHighlight) highlightedArticle=null;
  titleEl.textContent=c;
  renderCats();
  itemsEl.innerHTML = data[c].map((x,i)=>`<div class="item product-wrap ${highlightedArticle && String(x[0]).toLowerCase()===String(highlightedArticle).toLowerCase()?'searched-highlight':''}" data-article-number="${x[0]}">
    <button class="product-main" onclick="add('${x[0]}','${x[1].replaceAll("'","&#39;")}',${x[2].replace(',','.')})">
      <div class="num">${x[0]}</div><div class="name">${x[1]}</div><div class="price">${x[2]} €</div>
    </button>
    <button class="edit-btn" onclick="editProduct('${c.replaceAll("'","\'")}',${i})">✎</button>
  </div>`).join('')
  + `<button class="item add-product-tile" onclick="addProduct()"><div class="plus">＋</div><div class="name">Neues Produkt</div><div class="price">Hinzufügen</div></button>`;
  if(highlightedArticle){
    requestAnimationFrame(()=>{
      const hit=itemsEl.querySelector('.searched-highlight');
      if(hit) hit.scrollIntoView({behavior:'smooth',block:'center',inline:'nearest'});
    });
  }
}
function add(n,name,p){let x=order.find(o=>o.n===n);x?x.q++:order.push({n,name,p,q:1});renderOrder()}
function renderOrder(){rowsEl.innerHTML=order.length?order.map((o,i)=>`<div class="row"><div class="qty">${o.q}×</div><div class="rowname"><b>${o.n}</b> · ${o.name}</div><div>${euro(o.p*o.q)} <span class="del" onclick="removeItem(${i})">✕</span></div></div>`).join(''):'<div style="padding:25px;color:#999;text-align:center">Noch keine Bestellung</div>';sumEl.textContent=euro(order.reduce((a,o)=>a+o.p*o.q,0))}
function addProduct(){
  alert('Demo: Hier kann später ein neues Produkt mit Nummer, Name und Preis angelegt werden.');
}
function removeItem(i){order.splice(i,1);renderOrder()}
function clearOrder(){order=[];renderOrder()}
function pay(){if(!order.length)return alert('Keine Bestellung vorhanden.');alert('Barzahlung ausgewählt · Demo')}
function sendKitchen(){if(!order.length)return alert('Keine Bestellung vorhanden.');alert('Bestellung #'+String(Math.floor(Math.random()*900)+100)+' wurde an die Küche gesendet. · Demo')}
selectCat(cat);
</script>

  <div class="modal">
    <h2 id="modalTitle">Neues Produkt</h2>
    <label>Nummer<input id="pNum" inputmode="numeric" placeholder="z. B. 63"></label>
    <label>Name<input id="pName" placeholder="Produktname"></label>
    <label>Preis (€)<input id="pPrice" inputmode="decimal" placeholder="18,00"></label>
    <div class="modal-actions">
      <button class="action secondary" onclick="closeModal()">ABBRECHEN</button>
      <button class="action cash" onclick="saveProduct()">SPEICHERN</button>
    </div>
  </div>
</div>
<script>
const STORAGE_KEY='bei-maria-demo-data-v3';
let editingProduct=null;
const modalEl=document.getElementById('modal'), modalTitleEl=document.getElementById('modalTitle'), pNumEl=document.getElementById('pNum'), pNameEl=document.getElementById('pName'), pPriceEl=document.getElementById('pPrice');

function saveData(){
  localStorage.setItem(STORAGE_KEY, JSON.stringify(data));
}
function loadData(){
  try{
    const saved=localStorage.getItem(STORAGE_KEY);
    if(saved) Object.assign(data, JSON.parse(saved));
  }catch(e){}
}
function addProduct(){
  editingProduct=null;
  modalTitleEl.textContent='Neues Produkt';
  pNumEl.value=''; pNameEl.value=''; pPriceEl.value='';
  modalEl.classList.add('show'); pNumEl.focus();
}
function editProduct(catName, index){
  const x=data[catName][index];
  editingProduct={catName,index};
  modalTitleEl.textContent='Produkt bearbeiten';
  pNumEl.value=x[0]; pNameEl.value=x[1]; pPriceEl.value=x[2];
  modalEl.classList.add('show'); pNameEl.focus();
}
function closeModal(){modalEl.classList.remove('show')}
function saveProduct(){
  const n=pNumEl.value.trim(), name=pNameEl.value.trim();
  const raw=pPriceEl.value.trim().replace(',','.');
  const price=parseFloat(raw);
  if(!n || !name || !Number.isFinite(price) || price<0){
    alert('Bitte Nummer, Name und gültigen Preis eingeben.');
    return;
  }
  const product=[n,name,price.toFixed(2).replace('.',',')];
  if(editingProduct) data[editingProduct.catName][editingProduct.index]=product;
  else data[cat].push(product);
  saveData(); closeModal(); selectCat(cat);
}
function saveTableFromInput(){
  const input=document.getElementById('tableInput');
  let value=parseInt(input.value,10);
  if(!Number.isFinite(value) || value<1) value=1;
  input.value=value;
  localStorage.setItem('bei-maria-table',String(value));
}
function loadTable(){
  const t=localStorage.getItem('bei-maria-table')||'7';
  const input=document.getElementById('tableInput');
  if(input) input.value=t;
}
function printReceipt(){
  if(!order.length){alert('Keine Bestellung vorhanden.');return;}
  const table=localStorage.getItem('bei-maria-table')||'7';
  const total=order.reduce((a,o)=>a+o.p*o.q,0);
  const lines=order.map(o=>`${o.q} x ${o.name}   ${euro(o.p*o.q)}`).join('\\n');
  const w=window.open('','_blank','width=420,height=700');
  if(!w){alert('Druckfenster wurde blockiert.');return;}
  w.document.write(`<html><head><title>BEI MARIA</title><style>
  body{font-family:monospace;width:72mm;margin:0 auto;padding:5mm;font-size:13px}
  h2{text-align:center;margin:0 0 5px}pre{white-space:pre-wrap}hr{border:0;border-top:1px dashed #000}
  .total{font-size:18px;font-weight:bold;text-align:right}
.modal-backdrop{position:fixed;inset:0;background:rgba(0,0,0,.72);display:none;align-items:center;justify-content:center;z-index:50;padding:20px}
.modal-backdrop.show{display:flex}.modal{width:min(420px,100%);background:#171b1d;border:1px solid #444;border-radius:16px;padding:22px;box-shadow:0 20px 60px #000}
.modal h2{margin:0 0 18px}.modal label{display:block;font-size:14px;color:#bbb;margin:12px 0}.modal input{display:block;width:100%;margin-top:6px;background:#0e1112;border:1px solid #3b4246;color:#fff;border-radius:9px;padding:13px;font-size:17px;outline:none}.modal input:focus{border-color:var(--pink)}
.modal-actions{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:18px}.product-wrap{padding:0;position:relative;overflow:hidden}.product-main{background:transparent;border:0;color:#fff;text-align:left;width:100%;height:100%;padding:12px;padding-right:42px;cursor:pointer}.edit-btn{position:absolute;right:8px;top:8px;width:30px;height:30px;border:1px solid #444;background:#242a2d;color:#fff;border-radius:7px;cursor:pointer}.edit-btn:hover{background:var(--pink)}

.orderhead{display:flex;align-items:center;justify-content:center;gap:12px}
.orderhead input{width:105px;background:#fff;color:#111;border:0;border-radius:8px;padding:6px 8px;font-size:25px;font-weight:800;text-align:center;outline:none}
@media(max-width:760px){.logo{width:220px;height:65px}.orderhead input{width:85px;font-size:22px}}
</style></head><body>
  <h2>BEI MARIA</h2><div style="text-align:center">TISCH ${table}</div><hr><pre>${lines}</pre><hr>
  <div class="total">SUMME ${euro(total)}</div><p style="text-align:center">BARZAHLUNG<br>Vielen Dank!</p>
  <script>window.onload=()=>window.print()<\/script></body></html>`);
  w.document.close();
}
function pay(){
  if(!order.length){alert('Keine Bestellung vorhanden.');return;}
  printReceipt();
}
function sendKitchen(){
  if(!order.length){alert('Keine Bestellung vorhanden.');return;}
  alert('Bestellung wurde an die Küche gesendet.\\n\\nDrucker-Anbindung kommt im nächsten Schritt.');
}
function clearOrder(){order=[];renderOrder()}

loadData();
loadTable();
function searchArticle(){
  const input=document.getElementById('articleSearch');
  const q=(input?.value||'').trim().toLowerCase();
  if(!q){
    highlightedArticle=null;
    selectCat(cat);
    return;
  }
  const matches=[];
  Object.entries(data).forEach(([catName,products])=>products.forEach((x,i)=>{
    if(String(x[0]).toLowerCase()===q) matches.push({catName,x,i});
  }));
  if(!matches.length){
    highlightedArticle=null;
    alert('Artikelnummer nicht gefunden.');
    return;
  }
  let m=matches[0];
  if(matches.length>1){
    const choice=prompt('Mehrere Artikel mit dieser Nummer gefunden:
'+matches.map((m,i)=>`${i+1}. ${m.catName} · ${m.x[1]} · ${m.x[2]} €`).join('
')+'

Nummer auswählen:');
    const idx=parseInt(choice,10)-1;
    if(!Number.isInteger(idx)||!matches[idx]) return;
    m=matches[idx];
  }
  highlightedArticle=m.x[0];
  selectCat(m.catName,true);
  add(m.x[0],m.x[1],parseFloat(String(m.x[2]).replace(',','.')));
  input.focus();
  input.select();
}
const articleSearchEl=document.getElementById('articleSearch');
if(articleSearchEl) articleSearchEl.addEventListener('keydown',e=>{if(e.key==='Enter'){e.preventDefault();searchArticle();}});
selectCat(cat);
</script>
</body></html>
